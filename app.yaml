name: ggfinder
region: sgp

services:
  - name: app
    github:
      repo: cvpark0920/GGFinder
      branch: main
      deploy_on_push: true
    # Docker 빌드 사용
    dockerfile_path: Dockerfile
    source_dir: /
    # 빌드 타임 환경 변수를 Docker ARG로 전달
    # DigitalOcean은 BUILD_TIME 환경 변수를 빌드 환경에 설정하지만,
    # Dockerfile의 RUN 단계에서는 직접 접근할 수 없으므로
    # build_command를 사용하여 --build-arg로 명시적으로 전달해야 함
    build_command: |
      docker build \
        --build-arg VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://ggfinder-app-joib6.ondigitalocean.app}" \
        --build-arg VITE_GOOGLE_CLIENT_ID="${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID}}" \
        -t app \
        -f Dockerfile \
        .
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 4000
    health_check:
      http_path: /health
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: VITE_API_BASE_URL
        scope: BUILD_TIME
        value: ${_self.URL}
      # 빌드 타임 환경 변수: 프론트엔드 빌드 시 Google Client ID 필요
      # 주의: DigitalOcean 콘솔에서 GOOGLE_CLIENT_ID와 동일한 값으로 수동 설정 필요
      - key: VITE_GOOGLE_CLIENT_ID
        scope: BUILD_TIME
        type: SECRET
      - key: CORS_ORIGIN
        value: ${_self.URL}
      - key: FRONTEND_URL
        value: ${_self.URL}

databases:
  - name: db
    engine: PG
    production: true
    version: "16"
    db_name: ggfinder
    db_user: app

