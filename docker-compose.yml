version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ggfinder_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-ggfinder}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ggfinder_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 빌드 타임 환경 변수 (Dockerfile의 ARG로 전달)
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
        BUILD_VALIDATE_ENV: ${BUILD_VALIDATE_ENV:-false}
    container_name: ggfinder_app
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      # 런타임 환경 변수
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-ggfinder}?schema=public&sslmode=disable
      # JWT 및 OAuth 설정 (.env 파일에서 로드)
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # CORS 및 프론트엔드 URL 설정
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4000}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ggfinder_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  ggfinder_network:
    driver: bridge

