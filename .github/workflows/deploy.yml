name: Deploy to DigitalOcean Droplet

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 앱 디렉토리 설정
            APP_DIR="/app/ggfinder"
            mkdir -p $APP_DIR
            cd $APP_DIR

            # Git 저장소 초기화 또는 업데이트
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch --all
              git reset --hard origin/main
            fi

            # 운영 환경용 .env 파일 생성
            # 주의: 보안을 위해 모든 민감 정보는 GitHub Secrets에서 가져옵니다.
            echo "NODE_ENV=production" > .env
            echo "PORT=4000" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            
            # DB 및 API URL 설정 (Droplet IP 기반)
            echo "POSTGRES_USER=app" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'ggfinder_secure_pass' }}" >> .env
            echo "POSTGRES_DB=ggfinder" >> .env
            echo "VITE_API_BASE_URL=http://${{ secrets.DROPLET_IP }}:4000" >> .env
            echo "CORS_ORIGIN=http://${{ secrets.DROPLET_IP }}:4000" >> .env
            echo "FRONTEND_URL=http://${{ secrets.DROPLET_IP }}:4000" >> .env

            # Docker 컨테이너 실행
            echo "🚀 Starting Docker containers..."
            docker compose down
            docker compose up -d --build

            # 정리
            docker image prune -f
            echo "✅ Deployment completed successfully!"

