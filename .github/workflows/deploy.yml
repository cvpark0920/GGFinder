name: Deploy to DigitalOcean Droplet

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 동일한 브랜치에 대한 동시 배포 방지
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # 진행 중인 배포를 취소하지 않음 (안전한 배포)

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 필요 (롤백용)

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.DROPLET_IP }}" ]; then
            echo "❌ DROPLET_IP secret is missing"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_USERNAME }}" ]; then
            echo "❌ SSH_USERNAME secret is missing"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ SSH_PRIVATE_KEY secret is missing"
            exit 1
          fi
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "❌ JWT_SECRET secret is missing"
            exit 1
          fi
          echo "✅ All required secrets are present"

      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        id: deploy
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 300s
          script: |
            set -euo pipefail  # 엄격한 에러 처리
            
            # 변수 설정
            APP_DIR="/app/ggfinder"
            BACKUP_DIR="/app/ggfinder-backups"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            CURRENT_BACKUP="${BACKUP_DIR}/${TIMESTAMP}"
            
            echo "🚀 Starting deployment process..."
            echo "📅 Timestamp: ${TIMESTAMP}"
            
            # 1. GitHub 호스트 키 등록 (보안 강화)
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            if ! grep -q "github.com" ~/.ssh/known_hosts 2>/dev/null; then
              ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null || true
              chmod 600 ~/.ssh/known_hosts
            fi
            
            # 2. 디렉토리 설정 및 권한 부여
            sudo mkdir -p ${APP_DIR} ${BACKUP_DIR}
            sudo chown -R ${{ secrets.SSH_USERNAME }}:${{ secrets.SSH_USERNAME }} ${APP_DIR} ${BACKUP_DIR}
            cd ${APP_DIR}
            
            echo "📂 Current Directory: $(pwd)"
            
            # 3. 백업 디렉토리 미리 생성 (Git clone 전에 생성)
            echo "💾 Preparing backup directory..."
            mkdir -p ${CURRENT_BACKUP}
            echo "✅ Backup directory ready: ${CURRENT_BACKUP}"
            
            # 4. 기존 배포 백업 (롤백을 위해)
            if [ -f "docker-compose.yml" ]; then
              echo "💾 Creating backup of current deployment..."
              cp -r docker-compose.yml .env* ${CURRENT_BACKUP}/ 2>/dev/null || true
              docker compose ps --format json > ${CURRENT_BACKUP}/containers.json 2>/dev/null || true
              echo "✅ Backup created at ${CURRENT_BACKUP}"
            fi
            
            # 5. Git 저장소 초기화 또는 업데이트
            if [ ! -d ".git" ]; then
              echo "🚀 Cloning repository for the first time..."
              # 디렉토리가 비어있지 않은 경우 정리
              if [ "$(ls -A . 2>/dev/null)" ]; then
                echo "⚠️  Directory is not empty. Cleaning up..."
                # docker-compose.yml과 .env 파일은 백업 후 제거
                if [ -f "docker-compose.yml" ]; then
                  mkdir -p ${CURRENT_BACKUP}
                  cp docker-compose.yml .env* ${CURRENT_BACKUP}/ 2>/dev/null || true
                fi
                # Git 관련 파일 제외하고 정리
                find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} + 2>/dev/null || true
              fi
              # GitHub Deploy Key 또는 PAT 사용 권장
              GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts" \
                git clone -v git@github.com:${{ github.repository }}.git . || {
                  echo "❌ Git clone failed. Please ensure GitHub SSH key is configured."
                  echo "💡 Tip: If this is the first deployment, you may need to:"
                  echo "   1. Set up GitHub Deploy Key on the Droplet"
                  echo "   2. Or configure SSH key in ~/.ssh/"
                  exit 1
                }
            else
              echo "🔄 Updating existing repository..."
              # 현재 브랜치 확인
              CURRENT_BRANCH=$(git branch --show-current 2>/dev/null || echo "main")
              git fetch --all
              # 원격 브랜치 확인
              if git ls-remote --heads origin main | grep -q main; then
                git reset --hard origin/main
                git clean -fd
              else
                echo "⚠️  main branch not found, checking out current branch: ${CURRENT_BRANCH}"
                git reset --hard origin/${CURRENT_BRANCH} || git reset --hard HEAD
                git clean -fd
              fi
            fi
            
            # 6. 현재 커밋 해시 저장 (롤백용)
            COMMIT_HASH=$(git rev-parse HEAD)
            echo "📌 Deploying commit: ${COMMIT_HASH}"
            # 백업 디렉토리가 존재하는지 다시 확인하고 생성
            mkdir -p ${CURRENT_BACKUP}
            echo "${COMMIT_HASH}" > ${CURRENT_BACKUP}/commit_hash.txt
            echo "✅ Commit hash saved: ${COMMIT_HASH}"
            
            # 7. 운영 환경용 .env 파일 생성 (보안 강화)
            echo "📝 Creating .env file..."
            
            # 프론트엔드 URL (HTTPS 도메인 또는 기본값)
            FRONTEND_URL="${{ secrets.FRONTEND_URL || 'https://finder.ggacademy.top' }}"
            VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL || secrets.FRONTEND_URL || 'https://finder.ggacademy.top' }}"
            CORS_ORIGIN="${{ secrets.CORS_ORIGIN || secrets.FRONTEND_URL || 'https://finder.ggacademy.top' }}"
            
            # .env.example 파일이 있으면 기존 .env와 병합, 없으면 새로 생성
            if [ -f ".env.example" ]; then
              echo "📋 .env.example 파일을 기반으로 .env 파일 생성..."
              # 기존 .env 파일이 있으면 백업
              if [ -f ".env" ]; then
                cp .env .env.backup.$(date +%Y%m%d_%H%M%S) || true
                echo "💾 기존 .env 파일 백업 완료"
              fi
            fi
            
            # .env 파일 생성 (GitHub Secrets 우선 사용)
            cat <<EOF > .env
            NODE_ENV=production
            PORT=4000
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            POSTGRES_USER=app
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'ggfinder_secure_pass' }}
            POSTGRES_DB=ggfinder
            POSTGRES_PORT=5432
            DATABASE_URL=postgresql://app:${{ secrets.POSTGRES_PASSWORD || 'ggfinder_secure_pass' }}@db:5432/ggfinder?schema=public&sslmode=disable
            # 프론트엔드 및 API URL 설정 (빌드 타임 환경 변수 포함)
            VITE_API_BASE_URL=${VITE_API_BASE_URL}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            CORS_ORIGIN=${CORS_ORIGIN}
            FRONTEND_URL=${FRONTEND_URL}
            EOF
            
            # .env 파일 권한 설정 (보안)
            chmod 600 .env
            echo "✅ .env 파일 생성 완료"
            
            # 8. Docker Compose 빌드 인자 설정
            # HTTPS 도메인 우선 사용, 없으면 IP 사용
            FRONTEND_DOMAIN="${{ secrets.FRONTEND_URL || secrets.VITE_API_BASE_URL || 'https://finder.ggacademy.top' }}"
            # 도메인이 https://로 시작하지 않으면 추가
            if [[ ! "$FRONTEND_DOMAIN" =~ ^https?:// ]]; then
              FRONTEND_DOMAIN="https://${FRONTEND_DOMAIN}"
            fi
            export VITE_API_BASE_URL="${FRONTEND_DOMAIN}"
            export VITE_GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
            export BUILD_VALIDATE_ENV="false"
            echo "🔧 Build args: VITE_API_BASE_URL=${VITE_API_BASE_URL}"
            
            # 9. 기존 컨테이너 중지 (graceful shutdown)
            echo "🛑 Stopping existing containers..."
            docker compose down --timeout 30 --remove-orphans || true
            
            # 10. Docker 빌드 캐시 정리 및 이미지 빌드
            echo "🐳 Cleaning Docker build cache..."
            docker builder prune -af --filter "until=24h" || true
            
            echo "🐳 Building and starting Docker containers..."
            # 첫 번째 빌드 시도
            if ! docker compose build --no-cache --pull 2>&1 | tee /tmp/build.log; then
              echo "⚠️  First build attempt failed, cleaning cache and retrying..."
              # 빌드 캐시 완전 정리
              docker builder prune -af || true
              docker system prune -af --volumes || true
              
              # 두 번째 빌드 시도
              if ! docker compose build --no-cache --pull; then
                echo "❌ Docker build failed after retry"
                # 롤백 시도
                if [ -d "${CURRENT_BACKUP}" ] && [ -f "${CURRENT_BACKUP}/docker-compose.yml" ]; then
                  echo "🔄 Attempting rollback..."
                  cp ${CURRENT_BACKUP}/docker-compose.yml .
                  cp ${CURRENT_BACKUP}/.env* . 2>/dev/null || true
                  docker compose up -d || true
                fi
                exit 1
              fi
            fi
            
            docker compose up -d || {
              echo "❌ Docker compose up failed"
              # 롤백 시도
              if [ -d "${CURRENT_BACKUP}" ] && [ -f "${CURRENT_BACKUP}/docker-compose.yml" ]; then
                echo "🔄 Attempting rollback..."
                cp ${CURRENT_BACKUP}/docker-compose.yml .
                cp ${CURRENT_BACKUP}/.env* . 2>/dev/null || true
                docker compose up -d || true
              fi
              exit 1
            }
            
            # 11. 컨테이너 상태 확인
            echo "⏳ Waiting for containers to be healthy..."
            sleep 10
            
            # 헬스체크 (최대 60초 대기)
            MAX_WAIT=60
            ELAPSED=0
            while [ $ELAPSED -lt $MAX_WAIT ]; do
              if docker compose ps | grep -q "healthy\|running"; then
                HEALTH_STATUS=$(curl -sf http://localhost:4000/health || echo "unhealthy")
                if echo "$HEALTH_STATUS" | grep -q "status.*ok\|healthy"; then
                  echo "✅ Health check passed"
                  break
                fi
              fi
              echo "⏳ Waiting for health check... (${ELAPSED}s/${MAX_WAIT}s)"
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done
            
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "⚠️ Health check timeout. Checking container status..."
              docker compose ps
              docker compose logs --tail=50 app
              
              # 마이그레이션 실패 확인
              if docker compose logs app 2>&1 | grep -q "failed migrations\|P3009"; then
                echo "🔧 Detected failed migration. Attempting to resolve..."
                docker compose exec -T app npx prisma@6.1.0 migrate resolve --applied 20251215234033_add_father_mother_age 2>/dev/null || {
                  echo "⚠️  Could not resolve migration automatically. Manual intervention may be required."
                }
                echo "🔄 Restarting container after migration resolution..."
                docker compose restart app
                sleep 10
                # 다시 헬스체크 시도
                HEALTH_STATUS=$(curl -sf http://localhost:4000/health || echo "unhealthy")
                if echo "$HEALTH_STATUS" | grep -q "status.*ok\|healthy"; then
                  echo "✅ Health check passed after migration resolution"
                else
                  echo "❌ Deployment failed even after migration resolution. Please check logs."
                  exit 1
                fi
              else
                echo "❌ Deployment may have issues. Please check logs."
                exit 1
              fi
            fi
            
            # 12. 오래된 이미지 정리 (디스크 공간 확보)
            echo "🧹 Cleaning up old Docker images..."
            docker image prune -af --filter "until=168h" || true  # 7일 이상 된 이미지 삭제
            
            # 13. 오래된 백업 정리 (최근 5개만 유지)
            echo "🧹 Cleaning up old backups..."
            ls -t ${BACKUP_DIR} | tail -n +6 | xargs -r -I {} rm -rf ${BACKUP_DIR}/{} || true
            
            echo "✅ Deployment completed successfully!"
            echo "📊 Container status:"
            docker compose ps
            echo "🔗 Application URL: http://${{ secrets.DROPLET_IP }}:4000"
            echo "🏥 Health check: http://${{ secrets.DROPLET_IP }}:4000/health"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        if: success()
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🔍 Verifying deployment..."
            cd /app/ggfinder
            
            # 최종 헬스체크
            HEALTH_RESPONSE=$(curl -sf http://localhost:4000/health || echo "failed")
            if echo "$HEALTH_RESPONSE" | grep -q "status.*ok\|healthy"; then
              echo "✅ Deployment verification successful"
              echo "📋 Health check response:"
              echo "$HEALTH_RESPONSE" | head -20
            else
              echo "❌ Deployment verification failed"
              echo "📋 Health check response:"
              echo "$HEALTH_RESPONSE"
              docker compose logs --tail=30 app
              exit 1
            fi
            
            # 컨테이너 상태 확인
            echo "📊 Container status:"
            docker compose ps

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.deploy.outcome }}" == "success" ]; then
            echo "✅ **Status**: Deployment Successful" >> $GITHUB_STEP_SUMMARY
            echo "🔗 **URL**: http://${{ secrets.DROPLET_IP }}:4000" >> $GITHUB_STEP_SUMMARY
            echo "🏥 **Health Check**: http://${{ secrets.DROPLET_IP }}:4000/health" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status**: Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
