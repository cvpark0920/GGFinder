name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  NODE_VERSION: '20'

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Prisma
        run: npm install prisma@6.1.0 @prisma/client@6.1.0 --save-dev --save-exact

      - name: Generate Prisma Client
        run: npx prisma@6.1.0 generate

      - name: Validate Prisma schema
        run: npx prisma@6.1.0 validate

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:4000

      - name: Build server
        run: npm run build:server

      - name: Check for build errors
        run: |
          if [ ! -d "build" ]; then
            echo "❌ Frontend build directory not found"
            exit 1
          fi
          if [ ! -d "server/dist" ]; then
            echo "❌ Server build directory not found"
            exit 1
          fi
          echo "✅ Build completed successfully"

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ggfinder:ci-test
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL || 'http://localhost:4000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image
        run: |
          echo "🔍 Verifying Docker image..."
          docker images ggfinder:ci-test
          
          echo "📦 Checking image layers..."
          docker history ggfinder:ci-test --no-trunc | head -10
          
          echo "✅ Docker image built successfully"
          
      - name: Check image size
        run: |
          IMAGE_SIZE=$(docker images ggfinder:ci-test --format "{{.Size}}")
          echo "📊 Docker image size: $IMAGE_SIZE"
          
          # 이미지 크기가 2GB를 초과하면 경고
          SIZE_BYTES=$(docker images ggfinder:ci-test --format "{{.Size}}" | sed 's/[^0-9]//g')
          if [ -z "$SIZE_BYTES" ]; then
            echo "⚠️ Could not determine image size"
          else
            echo "✅ Image size check passed"
          fi

